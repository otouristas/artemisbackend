name: ArtemisCRM
options:
  bundleIdPrefix: gr.artemisrental
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: el
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "S768Y6EZW8"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: "2.0.0"

targets:
  ArtemisCRM:
    type: application
    platform: iOS
    sources:
      - path: ArtemisCRM
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.artemisrental.crm
        PRODUCT_NAME: ArtemisCRM
        INFOPLIST_FILE: ArtemisCRM/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Push Notifications is enabled on the App ID (team S768Y6EZW8).
        CODE_SIGN_ENTITLEMENTS: ArtemisCRM/Resources/ArtemisCRM.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        Release:
          # App Store / TestFlight signing (no registered devices needed).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Artemis CRM App Store"

schemes:
  ArtemisCRM:
    build:
      targets:
        ArtemisCRM: all
    run:
      config: Debug
      commandLineArguments:
        "-DemoMode": false
    archive:
      config: Release
