name: ArtemisCRM
options:
  bundleIdPrefix: gr.artemisrental
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: el
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: "2.0.0"

targets:
  ArtemisCRM:
    type: application
    platform: iOS
    sources:
      - path: ArtemisCRM
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gr.artemisrental.crm
        PRODUCT_NAME: ArtemisCRM
        INFOPLIST_FILE: ArtemisCRM/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Remote push (aps-environment). Needs the Push Notifications capability on the App ID.
        # Archive/TestFlight signing switches aps-environment to production. See README.md › "Remote push".
        CODE_SIGN_ENTITLEMENTS: ArtemisCRM/Resources/ArtemisCRM.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"

schemes:
  ArtemisCRM:
    build:
      targets:
        ArtemisCRM: all
    run:
      config: Debug
      commandLineArguments:
        "-DemoMode": false
    archive:
      config: Release
